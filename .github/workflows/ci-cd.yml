name: Auth Lambda CI/CD

# Standalone repo. Install @dinhogt/domain-shared from GitHub Packages.
# OIDC → IAM (ADR-009). Sem AWS_ACCESS_KEY_ID.

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - '**.md'

concurrency:
  group: auth-lambda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1

jobs:
  security-gate:
    uses: ./.github/workflows/security-gate.yml

  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dinhogt'

      - name: Install lambda deps
        run: |
          if [ -f yarn.lock ] && grep -q '@dinhogt/domain-shared@' yarn.lock; then
            yarn install --frozen-lockfile
          else
            yarn install
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Package zips (auth + notify)
        run: yarn package

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: lambda-zips
          path: |
            auth-cpf.zip
            notify-os.zip
          retention-days: 3

  cd:
    # OIDC CD opcional: ENABLE_OIDC_CD=true + AWS_ROLE_ARN. Caso contrário deploy via deploy-aws.sh.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') &&
      vars.ENABLE_OIDC_CD == 'true'
    needs: [ci, security-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'homolog' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: lambda-zips

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.AUTH_LAMBDA_NAME }}" \
            --zip-file fileb://auth-cpf.zip
          if [ -n "${{ secrets.NOTIFY_LAMBDA_NAME }}" ]; then
            aws lambda update-function-code \
              --function-name "${{ secrets.NOTIFY_LAMBDA_NAME }}" \
              --zip-file fileb://notify-os.zip
          else
            echo "NOTIFY_LAMBDA_NAME unset — skip notify-os deploy"
          fi
