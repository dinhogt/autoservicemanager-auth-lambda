name: Auth Lambda CI/CD

# Standalone repo. Install @dinhogt/domain-shared from GitHub Packages.
# OIDC → IAM (ADR-009). Sem AWS_ACCESS_KEY_ID.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1

jobs:
  security-gate:
    uses: ./.github/workflows/security-gate.yml

  ci:
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dinhogt'

      - name: Install lambda deps
        # Prefer GITHUB_TOKEN after package "Manage Actions access" includes this repo.
        # Fallback: repo secret PACKAGES_READ_TOKEN (classic PAT with read:packages).
        run: |
          if [ -f yarn.lock ] && grep -q '@dinhogt/domain-shared@' yarn.lock; then
            yarn install --frozen-lockfile
          else
            yarn install
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Bundle
        run: yarn build

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: auth-cpf-bundle
          path: dist/handler.js

  cd:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    needs: [ci, security-gate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dinhogt'

      - name: Build lambda zip
        run: |
          if [ -f yarn.lock ] && grep -q '@dinhogt/domain-shared@' yarn.lock; then
            yarn install --frozen-lockfile
          else
            yarn install
          fi
          yarn package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.AUTH_LAMBDA_NAME }}" \
            --zip-file fileb://auth-cpf.zip
